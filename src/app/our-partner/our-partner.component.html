<section class="partners">
  <header class="head">
    <h2>Our Partners</h2>
    <p>
      Collaborating with leading organizations to create a robust ecosystem for innovation
      <br />
      and entrepreneurship
    </p>
  </header>

  <div class="card">
    <div class="carousel-wrapper" (mouseenter)="pause()" (mouseleave)="play()">
      <!-- Corporate -->
      <h3 class="group-title">Corporate Partners</h3>
      <div class="carousel">
        <div class="viewport" #corpViewport>
          <div
            class="track"
            [style.transform]="transform(corpIdx, corpCols)"
            [style.transition]="animating ? 'transform 480ms ease' : 'none'"
          >
            <div class="slide" *ngFor="let c of corporate" [style.--cols]="corpCols">
              <div class="logo-box">
                <img [src]="c.src" [alt]="c.alt" />
              </div>
            </div>
          </div>
        </div>

        <!-- ⬅️➡️ Corporate arrows -->
        <button
          class="nav-arrow left"
          type="button"
          aria-label="Previous corporate logos"
          (click)="prevCorp()"
        >
          &#10094;
        </button>
        <button
          class="nav-arrow right"
          type="button"
          aria-label="Next corporate logos"
          (click)="nextCorp()"
        >
          &#10095;
        </button>
      </div>

      <!-- Knowledge -->
      <h3 class="group-title" style="padding-top: 20px">Knowledge Partners</h3>
      <div class="carousel">
        <div class="viewport" #knViewport>
          <div
            class="track"
            [style.transform]="transform(knIdx, knCols)"
            [style.transition]="animating ? 'transform 480ms ease' : 'none'"
          >
            <div class="slide" *ngFor="let k of knowledge" [style.--cols]="knCols">
              <div class="logo-box">
                <img [src]="k.src" [alt]="k.alt" />
              </div>
            </div>
          </div>
        </div>

        <!-- ⬅️➡️ Knowledge arrows -->
        <button
          class="nav-arrow left"
          type="button"
          aria-label="Previous knowledge logos"
          (click)="prevKn()"
        >
          &#10094;
        </button>
        <button
          class="nav-arrow right"
          type="button"
          aria-label="Next knowledge logos"
          (click)="nextKn()"
        >
          &#10095;
        </button>
      </div>

      <!-- Shared controls (dots jump both rows together) -->
      <!-- <div class="shared-controls">
        <div class="dots">
          <button
            *ngFor="let i of range(sharedPages)"
            class="dot"
            [class.active]="currentSharedPage === i"
            (click)="goToAll(i)"
            aria-label="Go to slide {{ i + 1 }}"
          ></button>
        </div>
      </div> -->
    </div>
  </div>

  <p class="cta-note">Join 200+ organizations already partnering with RTIH</p>
</section>
